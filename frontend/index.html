<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Biblioteca - API</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Sistema Biblioteca</h1>
    <p>Interface para testar a API</p>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="alunos">Alunos</button>
    <button class="tab" data-tab="emprestimos">Empréstimos</button>
  </nav>

  <main>
    <!-- ============ ALUNOS ============ -->
    <section id="tab-alunos" class="tab-content active">
      <div class="card">
        <h2>Cadastrar Aluno</h2>
        <form id="form-aluno-create">
          <input name="matricula" placeholder="Matrícula" required>
          <input name="nome" placeholder="Nome" required>
          <input name="email" type="email" placeholder="Email">
          <input name="telefone" placeholder="Telefone">
          <button type="submit">Cadastrar</button>
        </form>
      </div>

      <div class="card">
        <h2>Buscar Alunos</h2>
        <div class="search-bar">
          <input id="search-matricula" placeholder="Filtrar por matrícula (opcional)">
          <button id="btn-search-aluno">Buscar</button>
          <button id="btn-list-all-alunos" class="secondary">Listar Todos</button>
        </div>
      </div>

      <div class="card">
        <h2>Alunos</h2>
        <div id="alunos-list"><p class="empty">Nenhum aluno encontrado.</p></div>
      </div>
    </section>

    <!-- ============ EMPRESTIMOS ============ -->
    <section id="tab-emprestimos" class="tab-content">
      <div class="card">
        <h2>Registrar Empréstimo</h2>
        <form id="form-emprestimo-create">
          <input name="id_aluno" type="number" placeholder="ID do Aluno" required>
          <input name="id_exemplar" type="number" placeholder="ID do Exemplar" required>
          <input name="id_funcionario" type="number" placeholder="ID do Funcionário" required>
          <input name="dias_emprestimo" type="number" placeholder="Dias (padrão 7)" value="7">
          <button type="submit">Registrar</button>
        </form>
      </div>

      <div class="card">
        <h2>Registrar Devolução</h2>
        <form id="form-emprestimo-return">
          <input name="id_emprestimo" type="number" placeholder="ID do Empréstimo" required>
          <input name="valor_multa_diaria" step="0.01" placeholder="Multa diária (padrão 2.50)" value="2.50">
          <button type="submit">Devolver</button>
        </form>
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="js/script.js"></script>
</body>
</html>
